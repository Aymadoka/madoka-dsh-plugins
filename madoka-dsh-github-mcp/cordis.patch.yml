# GitHub 官方远端 MCP 接入层（新版 hosted server）。
#
# 两行：桥接行复用宿主自带的 `@deepseek-ai/dsh-mcp-client` 连官方远端
# MCP 服务器（Streamable HTTP），安装后模型直接有 `mcp__github__*` 工具；
# 配置页行挂载浏览器半侧的 token 表单（client.js），在 DSH 插件页里填 token。
# 上游文档见 https://github.com/github/github-mcp-server。
#
# 认证：远端服务必须认证。补丁里不存任何明文 token，只用 Loader `!!js`
# 引用环境变量 GITHUB_PERSONAL_ACCESS_TOKEN（与官方本地版同名）。
# 没设变量时 `failOnStartupError: true` 会让激活明确报错，而不是静默缺工具。
# 默认接默认 toolset（context/repos/issues/pull_requests/users）；
# 换只读把 url 改成 https://api.githubcopilot.com/mcp/readonly 即可。
- insert:
    - id: madoka-github-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.GITHUB_PERSONAL_ACCESS_TOKEN}`'
        failOnStartupError: true
    # 配置页挂载点：浏览器半侧（client.js 的 token 表单）挂在包名即本包的行上。
    # 无 Host 逻辑；token 表单往上一行的 `headers` 写，见 README“在 DSH 里填写 token”。
    - id: madoka-github-mcp-config
      name: 'madoka-dsh-github-mcp'
      config: {}
