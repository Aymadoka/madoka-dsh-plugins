# madoka-dsh-opencode-go-session layer.
#
# Only for OpenCode Go (provider key `opencode-go`). One job:
#
#   Mount the host plugin (lib/index.js header half) that attaches
#   `x-opencode-session` to opencode-go requests (fixes 400 MissingSessionID,
#   keeps session affinity and the prompt-cache routing).
#
# Deliberately NOTHING else: this layer declares no llm-pi-ai route protocol.
# A route-level `api`/`baseURL` would OVERRIDE every model's own catalog values
# (the engine resolves api = route.api ?? catalogModel.api and
# baseUrl = route.baseURL ?? catalogModel.baseUrl), and opencode-go spans three
# protocols and two baseUrls — declaring one value at the route silently broke
# six models (verified against the engine source: minimax-m3, qwen3.8-flash,
# muse-spark-1.2/1.3-contributor, gpt-5.6-luna, grok-4.6).
#
# Configuration (row `config`, all optional):
#   providers: [string]  provider route keys to attach the header to.
#                        Default is ['opencode-go'] only. Add a custom key
#                        only when you serve OpenCode Go under another name.
#   mode: 'session-id' | 'uuid'
#                        'session-id' (default, same as dsh-opencode-session):
#                        reuse the DSH session id — stable across turns and
#                        restarts, unique per conversation.
#                        'uuid': process-stable random uuid per DSH session.
#   debug: true|false    log every streamed call that receives the header.
#   debugFile: path      optional absolute path to append one JSON line per
#                        streamed call (handy when the console is not visible).
- insert:
    - id: madoka-opencode-go-session
      name: madoka-dsh-opencode-go-session
      config:
        providers:
          - opencode-go
        mode: session-id
        debug: false
